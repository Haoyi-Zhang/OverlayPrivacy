name: Repository integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '27'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate supplied materials and source/configuration syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p070-integrity"
          ulimit -v 3584000
          timeout --signal=TERM --kill-after=10s 60s python -B .github/scripts/check_repository.py 2>&1 | tee "$RUNNER_TEMP/p070-integrity/raw-output.log"
      - name: Retain integrity output even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p070-repository-integrity-output
          path: ${{ runner.temp }}/p070-integrity/
          if-no-files-found: warn
